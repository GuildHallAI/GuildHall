name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate backend
    if: github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.2

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Type-check backend
        working-directory: backend
        run: bun run check

      - name: Test backend
        working-directory: backend
        run: bun test
        env:
          DATABASE_URL: postgresql://guildhall:guildhall@127.0.0.1:5432/guildhall
          SOLANA_CLUSTER: devnet
          SOLANA_RPC_URL: https://api.devnet.solana.com
          DATA_ENCRYPTION_KEY: guildhall-ci-only-encryption-key-not-for-production

  runtime-tests:
    name: Validate GHAR
    if: github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghar
    env:
      GROQ_API_KEY: ci-groq-key
      GROQ_MODEL: ci-model
      TAVILY_API_KEY: ci-tavily-key
      GUILDHALL_BACKEND_URL: https://api.guildhallai.com
      GUILDHALL_AGENT_RUNTIME_TOKEN: ci-runtime-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.2

      - name: Install GHAR dependencies
        run: bun install --frozen-lockfile

      - name: Test GHAR
        run: bun run test

      - name: Type-check GHAR
        run: bun run typecheck

      - name: Build GHAR
        run: bun run build

  build-push:
    name: Build and publish backend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guildhall-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    name: Create backend release
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          fetch-depth: 0

      - name: Create release
        run: |
          tag="backend-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Trigger backend deployment
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    steps:
      - name: Call backend deploy hook when configured
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "BACKEND_DEPLOY_HOOK_URL is not configured; skipping backend deploy hook."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$BACKEND_DEPLOY_HOOK_URL" \
            || echo "Backend deploy hook could not be reached; image and release remain available."

  build-push-runtime:
    name: Build and publish GHAR image
    needs: [test, runtime-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guildhall-agent-runtime" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: runtime-metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish GHAR image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./ghar
          file: ./ghar/Dockerfile
          push: true
          tags: ${{ steps.runtime-metadata.outputs.tags }}
          labels: ${{ steps.runtime-metadata.outputs.labels }}

  deploy-runtime:
    name: Trigger GHAR deployment
    needs: build-push-runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'guildhallAI/guildhall'
    runs-on: ubuntu-latest
    steps:
      - name: Call GHAR deploy hook when configured
        env:
          GHAR_DEPLOY_HOOK_URL: ${{ secrets.GHAR_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$GHAR_DEPLOY_HOOK_URL" ]; then
            echo "GHAR_DEPLOY_HOOK_URL is not configured; skipping GHAR deploy hook."
            exit 0
          fi
          if ! curl --fail --silent --retry 3 --output /dev/null -X POST "$GHAR_DEPLOY_HOOK_URL"; then
            echo "GHAR deploy hook failed."
            exit 1
          fi
          echo "GHAR deploy hook accepted the deployment."
