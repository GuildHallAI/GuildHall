services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guildhall
      POSTGRES_USER: guildhall
      POSTGRES_PASSWORD: guildhall
    ports:
      - "5432:5432"
    volumes:
      - guildhall-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guildhall -d guildhall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  guildhall-postgres:
